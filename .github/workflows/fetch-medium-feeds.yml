name: Fetch Medium Feeds (境外抓取 → 仓库存档)

# Medium 对 GitHub 出口 IP 有持续 429 限流，采用「小批量 + 高频次」增量策略：
# 每 3 小时补抓 60 个未成功的源，逐步积累到全部成功。
# 也可在 Actions 页面手动点击 Run workflow（inputs.batch 可指定本次抓取数量）。
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: '本次补抓数量（默认 60）'
        required: false
        default: '60'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 增量补抓 Medium feed
        run: python scripts/fetch_medium.py ${{ github.event.inputs.batch || '60' }}

      - name: 提交抓取结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/ manifest.json
          if git diff --cached --quiet; then
            echo "无内容变化，跳过提交"
          else
            git commit -m "chore: update medium feeds $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
